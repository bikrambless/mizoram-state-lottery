services:
  - type: web
    name: mizoram-state-lottery
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: results
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: PORTAL_NAME
        value: MIZORAM STATE LOTTERY
      - key: PORTAL_SLUG
        value: mizoram-lottery
      - key: TAGLINE
        value: Official Daily Lottery Result Publishing Portal

